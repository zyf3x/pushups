<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Pushup Challenge</title>
    
    <!-- MediaPipe Libraries (Removed camera_utils to use native, robust browser APIs instead) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        #count-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4CAF50;
        }

        #feedback-display {
            font-size: 1rem;
            font-weight: bold;
            text-align: right;
            max-width: 50%;
        }

        .good-form { color: #4CAF50; }
        .bad-form { color: #F44336; }
        .warning { color: #FFC107; }

        #video-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .input_video {
            display: none;
        }

        .output_canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect */
        }

        #overlay-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            z-index: 20;
            text-align: center;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #555;
            width: 85%;
            max-width: 400px;
        }
        
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
            display: none; /* Hidden until button clicked */
        }

        #start-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }

        #start-btn:active {
            background-color: #45a049;
        }

        .error-icon {
            font-size: 3rem;
            color: #F44336;
            margin-bottom: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="overlay-message">
        <div class="spinner" id="spinner"></div>
        <div id="message-text">
            <strong>Ready for Pushups?</strong><br>
            <span style="font-size: 0.9rem; color: #aaa;">Ensure you are in a well-lit area.</span>
        </div>
        <button id="start-btn">Start Camera</button>
    </div>

    <div id="ui-container">
        <div class="hud-box">
            <div style="font-size: 0.9rem; color: #aaa; text-transform: uppercase;">Pushups</div>
            <div id="count-display">0</div>
        </div>
        <div class="hud-box" style="display: flex; flex-direction: column; align-items: flex-end;">
            <div style="font-size: 0.9rem; color: #aaa; text-transform: uppercase;">Form Status</div>
            <div id="feedback-display" class="warning">Position yourself</div>
        </div>
    </div>

    <div id="video-container">
        <!-- critical standard attributes for mobile web video -->
        <video class="input_video" autoplay playsinline muted></video>
        <canvas class="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        const countDisplay = document.getElementById('count-display');
        const feedbackDisplay = document.getElementById('feedback-display');
        const overlayMessage = document.getElementById('overlay-message');
        const messageText = document.getElementById('message-text');
        const spinner = document.getElementById('spinner');
        const startBtn = document.getElementById('start-btn');

        let pushupCount = 0;
        let positionState = "up"; 
        let isModelLoaded = false;
        let lastVideoTime = -1;

        // Angle math
        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            if (angle > 180.0) {
                angle = 360.0 - angle;
            }
            return angle;
        }

        // What happens when AI processes a frame
        function onResults(results) {
            if (!isModelLoaded) {
                isModelLoaded = true;
                overlayMessage.style.display = 'none'; // Hide loading screen
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ffffff', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#4CAF50', lineWidth: 2, radius: 4});

                const landmarks = results.poseLandmarks;
                
                // Decide which side of the body is visible
                const leftVisibility = (landmarks[11].visibility + landmarks[13].visibility + landmarks[15].visibility) / 3;
                const rightVisibility = (landmarks[12].visibility + landmarks[14].visibility + landmarks[16].visibility) / 3;
                
                let shoulder, elbow, wrist, hip, ankle;

                if (leftVisibility > rightVisibility) {
                    shoulder = landmarks[11];
                    elbow = landmarks[13];
                    wrist = landmarks[15];
                    hip = landmarks[23];
                    ankle = landmarks[27];
                } else {
                    shoulder = landmarks[12];
                    elbow = landmarks[14];
                    wrist = landmarks[16];
                    hip = landmarks[24];
                    ankle = landmarks[28];
                }

                if (shoulder.visibility > 0.5 && elbow.visibility > 0.5 && wrist.visibility > 0.5 && hip.visibility > 0.5) {
                    
                    const armAngle = calculateAngle(shoulder, elbow, wrist);
                    const bodyAngle = calculateAngle(shoulder, hip, ankle);

                    let feedbackText = "Looking Good!";
                    let feedbackClass = "good-form";

                    const isBackStraight = bodyAngle > 150 && bodyAngle < 190;
                    
                    if (!isBackStraight) {
                        feedbackText = "Keep back straight!";
                        feedbackClass = "bad-form";
                    } else {
                        if (armAngle > 160) {
                            if (positionState === "down") {
                                pushupCount++;
                                countDisplay.innerText = pushupCount;
                            }
                            positionState = "up";
                        }
                        
                        if (armAngle < 90) {
                            if (positionState === "up") {
                                positionState = "down";
                            }
                        }

                        if (positionState === "up" && armAngle < 160 && armAngle > 90) {
                             feedbackText = "Go lower!";
                             feedbackClass = "warning";
                        }
                        
                        if (positionState === "down") {
                             feedbackText = "Push up!";
                             feedbackClass = "warning";
                        }
                    }

                    feedbackDisplay.innerText = feedbackText;
                    feedbackDisplay.className = feedbackClass;

                } else {
                    feedbackDisplay.innerText = "Step back to show whole body";
                    feedbackDisplay.className = "warning";
                }
            }
            canvasCtx.restore();
        }

        // Initialize MediaPipe Pose
        const pose = new Pose({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
        }});

        pose.setOptions({
            modelComplexity: 0, // Best for mobile phones
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(onResults);

        // Native Camera Loop
        async function processVideo() {
            if (videoElement.readyState >= 2) {
                if (videoElement.currentTime !== lastVideoTime) {
                    lastVideoTime = videoElement.currentTime;
                    await pose.send({image: videoElement});
                }
            }
            requestAnimationFrame(processVideo);
        }

        // Button Click to Start Camera
        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            spinner.style.display = 'block';
            messageText.innerHTML = "<strong>Loading AI Model...</strong><br><span style='font-size: 0.9rem; color: #aaa;'>Please accept camera permissions</span>";
            
            try {
                // We ask for front camera, but we DO NOT force a strict width/height to avoid crashing
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false
                });

                videoElement.srcObject = stream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    
                    // Match the canvas perfectly to whatever the phone camera outputs natively
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    
                    // Start feeding frames to the AI
                    requestAnimationFrame(processVideo);
                };
            } catch (err) {
                spinner.style.display = 'none';
                messageText.innerHTML = `
                    <div class="error-icon">⚠️</div>
                    <strong style="color:#F44336">Camera Error</strong><br><br>
                    <span style="font-size: 0.9rem;">
                    Could not access camera. Make sure you haven't blocked permissions in your browser settings.
                    <br><br>Error: ${err.message}
                    </span>
                `;
            }
        });

    </script>
</body>
</html>
