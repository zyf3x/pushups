<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcade Pushup AI</title>
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@600;700&display=swap');

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* --- Gamified UI --- */
        #ui-container {
            position: absolute; top: 0; left: 0;
            width: 100%; padding: 20px;
            box-sizing: border-box; z-index: 10;
            display: flex; justify-content: space-between;
            pointer-events: none;
        }

        .hud-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid #00E5FF;
            box-shadow: 0 0 10px #00E5FF;
            text-align: center;
            transition: all 0.2s ease;
        }

        #count-display {
            font-family: 'Black Ops One', cursive;
            font-size: 4rem;
            color: #00E5FF;
            text-shadow: 0 0 15px #00E5FF;
            line-height: 1;
        }

        /* Pop animation for when a rep is counted */
        .pop-anim {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); filter: brightness(2); }
            100% { transform: scale(1); }
        }

        #level-display {
            color: #FF00FF;
            font-size: 1.2rem;
            text-shadow: 0 0 8px #FF00FF;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Progress Bar (Neon) */
        #progress-container {
            position: absolute;
            left: 20px; top: 50%;
            transform: translateY(-50%);
            width: 20px; height: 50vh;
            background: rgba(0,0,0,0.8);
            border: 2px solid #333;
            border-radius: 10px;
            overflow: hidden; z-index: 10;
            display: flex; flex-direction: column; justify-content: flex-end;
            box-shadow: inset 0 0 10px #000;
        }

        #progress-bar {
            width: 100%; height: 0%;
            background: linear-gradient(to top, #FF0055, #FFEA00);
            transition: height 0.1s linear, background 0.3s;
            box-shadow: 0 0 15px #FFEA00;
        }

        /* --- ZERO LATENCY VIDEO OVERLAY --- */
        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; background: #111;
        }

        /* Video plays smoothly underneath */
        .input_video {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        /* Canvas is completely transparent and just draws the skeleton on top */
        .output_canvas {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 2;
            pointer-events: none;
        }

        /* Intro Screen */
        #overlay-message {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20; text-align: center;
            background: rgba(10, 10, 20, 0.95);
            padding: 30px; border-radius: 20px;
            border: 2px solid #00E5FF;
            width: 85%; max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
            pointer-events: auto;
        }

        #start-btn {
            background: #00E5FF; color: #000;
            border: none; padding: 15px 30px;
            font-size: 1.5rem; font-weight: bold;
            font-family: 'Rajdhani', sans-serif;
            border-radius: 8px; cursor: pointer;
            margin-top: 20px; width: 100%;
            text-transform: uppercase;
            box-shadow: 0 0 15px #00E5FF;
            transition: 0.2s;
        }
        #start-btn:active { transform: scale(0.95); }

        #error-log {
            color: #FF0055; font-size: 0.9rem;
            margin-top: 15px; word-wrap: break-word;
        }
    </style>
</head>
<body>

    <div id="overlay-message">
        <h1 style="margin: 0; font-family: 'Black Ops One'; color: #00E5FF; font-size: 2.5rem;">READY?</h1>
        <p style="color: #ccc; font-size: 1.2rem;">Sound ON! 🔊<br>Get your whole body in frame.</p>
        <button id="start-btn">START CAMERA</button>
        <div id="error-log"></div>
    </div>

    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div id="ui-container">
        <div class="hud-box" id="score-box">
            <div id="level-display">ROOKIE</div>
            <div id="count-display">0</div>
        </div>
        <div class="hud-box" style="border-color: #FF00FF; box-shadow: 0 0 10px #FF00FF;">
            <div style="color: #FF00FF; font-weight: bold; text-transform: uppercase;">Tracker</div>
            <div id="feedback-display" style="font-size: 1.3rem; margin-top: 5px;">Stand by</div>
        </div>
    </div>

    <div id="video-container">
        <!-- Visible video layer handles camera feed natively = 0 lag -->
        <video class="input_video" autoplay playsinline muted></video>
        <!-- Transparent canvas layer just for drawing lines -->
        <canvas class="output_canvas"></canvas>
    </div>

    <script>
        const videoElement = document.getElementsByClassName('input_video')[0];
        const canvasElement = document.getElementsByClassName('output_canvas')[0];
        const canvasCtx = canvasElement.getContext('2d');
        
        const countDisplay = document.getElementById('count-display');
        const feedbackDisplay = document.getElementById('feedback-display');
        const levelDisplay = document.getElementById('level-display');
        const scoreBox = document.getElementById('score-box');
        const overlayMessage = document.getElementById('overlay-message');
        const startBtn = document.getElementById('start-btn');
        const errorLog = document.getElementById('error-log');
        const progressBar = document.getElementById('progress-bar');

        let pushupCount = 0;
        let positionState = "up"; 
        let isProcessing = false; // Prevents AI frame overlap

        // Audio Context for the "DING!" sound
        let audioCtx;

        function playDing() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.type = 'square'; // Arcade sound
            osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); // Slide up to A5
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function calculateAngle(a, b, c) {
            const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
            let angle = Math.abs(radians * 180.0 / Math.PI);
            return angle > 180.0 ? 360.0 - angle : angle;
        }

        function updateLevel() {
            if (pushupCount >= 20) levelDisplay.innerText = "BEAST MODE";
            else if (pushupCount >= 10) levelDisplay.innerText = "WARRIOR";
            else if (pushupCount >= 5) levelDisplay.innerText = "FIGHTER";
        }

        function onResults(results) {
            // ONLY CLEAR AND DRAW SKELETON. Do NOT draw the video. 
            // The video plays natively underneath this transparent canvas. (Zero lag!)
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                // Draw cool neon skeleton
                drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00E5FF', lineWidth: 4});
                drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#FF00FF', lineWidth: 2, radius: 4});

                const lm = results.poseLandmarks;
                const leftVis = (lm[11].visibility + lm[13].visibility + lm[15].visibility);
                const rightVis = (lm[12].visibility + lm[14].visibility + lm[16].visibility);
                
                let s, e, w, h, a; // shoulder, elbow, wrist, hip, ankle
                if (leftVis > rightVis) {
                    s=lm[11]; e=lm[13]; w=lm[15]; h=lm[23]; a=lm[27];
                } else {
                    s=lm[12]; e=lm[14]; w=lm[16]; h=lm[24]; a=lm[28];
                }

                if (s.visibility > 0.4 && e.visibility > 0.4 && h.visibility > 0.4) {
                    const armAngle = calculateAngle(s, e, w);
                    const bodyAngle = calculateAngle(s, h, a);

                    if (bodyAngle < 120) {
                        feedbackDisplay.innerText = "Straighten Back!";
                        progressBar.style.background = "#FF0055";
                    } else {
                        // Depth calculation (Super easy mode: Top is 150deg, Bottom is 110deg)
                        let depthPercent = ((150 - armAngle) / (150 - 110)) * 100;
                        depthPercent = Math.max(0, Math.min(100, depthPercent));
                        progressBar.style.height = `${depthPercent}%`;

                        if (positionState === "up") {
                            if (depthPercent >= 100) {
                                positionState = "down";
                                feedbackDisplay.innerText = "PUSH!";
                                progressBar.style.background = "#00E5FF"; // Neon Blue at bottom
                            } else {
                                feedbackDisplay.innerText = "Lower...";
                                progressBar.style.background = "linear-gradient(to top, #FF0055, #FFEA00)";
                            }
                        } else if (positionState === "down") {
                            if (depthPercent <= 5) {
                                positionState = "up";
                                pushupCount++;
                                countDisplay.innerText = pushupCount;
                                feedbackDisplay.innerText = "PERFECT!";
                                updateLevel();
                                
                                // Arcade Pop Effects
                                playDing();
                                countDisplay.classList.remove("pop-anim");
                                void countDisplay.offsetWidth; // Trigger reflow
                                countDisplay.classList.add("pop-anim");
                                
                                scoreBox.style.boxShadow = "0 0 30px #00E5FF";
                                setTimeout(() => scoreBox.style.boxShadow = "0 0 10px #00E5FF", 300);

                            } else {
                                feedbackDisplay.innerText = "Keep going up!";
                            }
                        }
                    }
                } else {
                    feedbackDisplay.innerText = "Show whole body";
                }
            } else {
                feedbackDisplay.innerText = "Searching...";
            }
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({
            modelComplexity: 0, 
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        // AI Loop - decoupled from video rendering to ensure smoothness
        async function aiLoop() {
            if (videoElement.readyState >= 2 && !isProcessing) {
                isProcessing = true;
                await pose.send({image: videoElement});
                isProcessing = false;
            }
            requestAnimationFrame(aiLoop);
        }

        startBtn.addEventListener('click', async () => {
            // Initialize Audio on user click (Required for Apple/Google rules)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            startBtn.innerText = "LOADING...";
            errorLog.innerText = "";

            try {
                // The most forgiving camera request possible. No resolutions, just ask for the front camera.
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' }, 
                    audio: false
                });

                videoElement.srcObject = stream;
                
                videoElement.onplay = () => {
                    // Sync the transparent canvas exactly to the video size
                    canvasElement.width = videoElement.videoWidth;
                    canvasElement.height = videoElement.videoHeight;
                    
                    overlayMessage.style.display = 'none';
                    aiLoop(); // Start AI tracking
                };
                
            } catch (err) {
                startBtn.innerText = "RETRY";
                // Dump the exact error to the screen so you know exactly why the phone is blocking it
                errorLog.innerHTML = `⚠️ <b>${err.name}</b>: ${err.message}<br><br>Make sure you didn't click "Deny", and that your browser has camera settings enabled.`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
